<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="title desc"><title id="title">Linux Threat Hunter workflow</title><desc id="desc">Process, socket, persistence and SSH data flow into heuristic triage and local JSON and HTML reports. Conceptual animation, not live results.</desc><style>.packet{animation:flow 7s linear infinite}@keyframes flow{0%{transform:translateX(0);opacity:0}15%,80%{opacity:1}100%{transform:translateX(175px);opacity:0}}@media(prefers-reduced-motion:reduce){.packet{animation:none}}</style><rect width="1000" height="290" rx="18" fill="#080f1d"/><g font-family="monospace"><text x="28" y="38" font-size="24" fill="#67e8f9">LINUX THREAT HUNTER</text><text x="28" y="66" font-size="14" fill="#9ab3d0">Read-only collection / explainable leads / explicit coverage</text><g fill="#102139" stroke="#315776"><rect x="28" y="95" width="290" height="130" rx="12"/><rect x="430" y="95" width="240" height="130" rx="12"/><rect x="790" y="95" width="182" height="130" rx="12"/></g><g fill="#cbdff3" font-size="17"><text x="48" y="129">/proc + socket inventory</text><text x="48" y="165">cron + systemd files</text><text x="48" y="201">SSH text-log sample</text><text x="450" y="135">HEURISTIC TRIAGE</text><text x="450" y="171">Rules + limitations</text><text x="450" y="204">No remediation</text><text x="810" y="135">LOCAL REPORTS</text><text x="810" y="171">JSON + HTML</text><text x="810" y="204">Review leads</text></g><path d="M318 160H430M670 160H790" stroke="#386384" stroke-width="2"/><g class="packet" fill="#38bdf8"><circle cx="322" cy="160" r="5"/><circle cx="674" cy="160" r="5"/></g><text x="28" y="264" font-size="13" fill="#8ba3be">Conceptual workflow — investigation leads are not confirmed threats.</text></g></svg>
