[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authguard-triage"
version = "0.1.0"
description = "Offline Linux authentication-log analysis across rotated plain-text and gzip logs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fahad Adeel" }]
keywords = ["security", "linux", "incident-response", "log-analysis", "soc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

[project.scripts]
authguard = "authguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
