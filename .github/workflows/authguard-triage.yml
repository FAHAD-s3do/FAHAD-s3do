name: AuthGuard Triage

on:
  push:
    paths:
      - "projects/authguard-triage/**"
      - ".github/workflows/authguard-triage.yml"
  pull_request:
    paths:
      - "projects/authguard-triage/**"
      - ".github/workflows/authguard-triage.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/authguard-triage

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --no-deps -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Analyze synthetic log fixture
        run: authguard examples/auth.log --year 2026 --json /tmp/authguard-report.json --html /tmp/authguard-report.html --redact-ips
