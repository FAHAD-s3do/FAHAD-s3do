name: Contribution snake
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/contribution-snake.yml']
permissions:
  contents: write
concurrency:
  group: contribution-snake
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate blue contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-snake.svg?palette=github-dark&color_snake=#38bdf8&color_dots=#0d1726,#153759,#205b8e,#2889bd,#7dd3fc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update generated SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: python
        run: |
          import os, json, base64, urllib.request, urllib.error
          from pathlib import Path
          url = "https://api.github.com/repos/" + os.environ["REPO"] + "/contents/assets/contribution-snake.svg"
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          data = Path("dist/contribution-snake.svg").read_bytes()
          payload = {"message": "Refresh contribution snake [skip ci]", "content": base64.b64encode(data).decode(), "branch": "main"}
          try:
              with urllib.request.urlopen(urllib.request.Request(url + "?ref=main", headers=headers)) as response:
                  current = json.load(response)
              if base64.b64decode(current["content"]) == data:
                  print("Snake is already up to date.")
                  raise SystemExit(0)
              payload["sha"] = current["sha"]
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          request = urllib.request.Request(url, data=json.dumps(payload).encode(), headers={**headers, "Content-Type": "application/json"}, method="PUT")
          with urllib.request.urlopen(request) as response:
              print("Published contribution snake:", response.status)
