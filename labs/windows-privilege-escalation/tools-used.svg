<title id="title">Tools used in the reconstructed Windows lab</title>
<desc id="desc">Windows target: version, build and architecture not retained. Metasploit Framework and Meterpreter: versions not retained. getuid inspects session identity; getsystem was the recalled elevation attempt. Decorative animation, not execution.</desc>
