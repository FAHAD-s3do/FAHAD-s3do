<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Fahad — security lab</title><desc id="desc">Terminal-style banner with black name text on a cyan panel, dark navy background and a subtle moving scan line. Break assumptions. Build defenses.</desc>
<style>.scan{animation:scan 9s linear infinite}.cursor{animation:blink 1.2s steps(2,end) infinite}@keyframes scan{from{transform:translateY(0)}to{transform:translateY(266px)}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.scan,.cursor{animation:none}.scan{opacity:0}}</style>
