<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Fahad — Cybersecurity, AI Security and DevSecOps</title>
<desc id="desc">Dark navy profile banner with an animated name reveal and blue cursor.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050912"/><stop offset="1" stop-color="#102747"/></linearGradient>
<linearGradient id="line"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
<clipPath id="reveal"><rect x="80" y="88" width="500" height="100"><animate attributeName="width" values="0;500;500;0;0" keyTimes="0;0.3;0.85;0.95;1" dur="7s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<rect width="1200" height="300" rx="20" fill="url(#bg)"/>
<g fill="none" stroke="#365778" opacity=".3"><circle cx="1115" cy="150" r="115"/><circle cx="1115" cy="150" r="83"/><path d="M930 0v300M990 0v300M1050 0v300M1110 0v300M1170 0v300M900 60h300M900 120h300M900 180h300M900 240h300"/></g>
<rect x="40" y="50" width="4" height="200" rx="2" fill="url(#line)"/>
<text x="80" y="66" fill="#7dd3fc" font-family="monospace" font-size="15" letter-spacing="4">SECURITY / ENGINEERING / AUTOMATION</text>
<text x="76" y="164" fill="#000000" font-family="monospace" font-size="86" font-weight="bold" letter-spacing="12" clip-path="url(#reveal)">FAHAD</text>
<rect x="405" y="99" width="5" height="68" fill="#38bdf8"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
<text x="80" y="218" fill="#b9cce2" font-family="Arial, sans-serif" font-size="22">Cybersecurity · AI Security · DevSecOps</text>
<text x="80" y="253" fill="#7298bd" font-family="Arial, sans-serif" font-size="16" letter-spacing="2">OFFENSIVE &amp; DEFENSIVE SECURITY</text>
</svg>