<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc">
<title id="title">Red and Blue Team collaboration</title>
<desc id="desc">Red offensive-testing and blue defensive-analysis signals converge into purple collaboration to improve security. Conceptual animation.</desc>
<style>
.red{animation:redMove 6s ease-in-out infinite}.blue{animation:blueMove 6s ease-in-out infinite}.merge{animation:mergePulse 6s ease-in-out infinite;transform-origin:500px 116px}
@keyframes redMove{0%,10%{transform:translateX(0);opacity:0}20%{opacity:1}60%,100%{transform:translateX(185px);opacity:0}}
@keyframes blueMove{0%,10%{transform:translateX(0);opacity:0}20%{opacity:1}60%,100%{transform:translateX(-185px);opacity:0}}
@keyframes mergePulse{0%,40%,100%{opacity:.35;transform:scale(1)}65%,80%{opacity:1;transform:scale(1.15)}}
@media(prefers-reduced-motion:reduce){.red,.blue,.merge{animation:none}}
</style>
<rect x="1" y="1" width="998" height="238" rx="16" fill="#080f1d" stroke="#223a56" stroke-width="2"/>
<g font-family="Arial,sans-serif" text-anchor="middle">
<text x="500" y="35" font-size="12" fill="#98adc7" letter-spacing="3">TEST / DETECT / IMPROVE</text>
<rect x="35" y="64" width="245" height="104" rx="12" fill="#211422" stroke="#743044"/>
<text x="157" y="108" font-size="23" font-weight="bold" fill="#fda4af">RED TEAM</text>
<text x="157" y="138" font-size="16" fill="#d5a4b0">Offensive testing</text>
<rect x="720" y="64" width="245" height="104" rx="12" fill="#101f36" stroke="#28547c"/>
<text x="842" y="108" font-size="23" font-weight="bold" fill="#7dd3fc">BLUE TEAM</text>
<text x="842" y="138" font-size="16" fill="#a2bedb">Detection &amp; defense</text>
<path d="M280 116H450" stroke="#743044" stroke-width="2"/><path d="M550 116H720" stroke="#28547c" stroke-width="2"/>
<circle class="red" cx="295" cy="116" r="6" fill="#fb7185"/><circle class="blue" cx="705" cy="116" r="6" fill="#38bdf8"/>
<circle class="merge" cx="500" cy="116" r="40" fill="#a855f7" opacity=".35"/>
<circle cx="500" cy="116" r="29" fill="#25153e" stroke="#c084fc" stroke-width="2"/>
<path d="M488 116H512M500 104V128" stroke="#e9d5ff" stroke-width="3" stroke-linecap="round"/>
<text x="500" y="189" font-size="18" font-weight="bold" fill="#d8b4fe">PURPLE TEAM</text>
<text x="500" y="216" font-size="14" fill="#98adc7">Shared findings. Stronger detections. Better defenses.</text>
</g></svg>