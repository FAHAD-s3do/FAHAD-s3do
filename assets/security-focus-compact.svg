<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="160" viewBox="0 0 1000 160" role="img" aria-labelledby="t d"><title id="t">Offensive security, defensive analysis and AI security</title><desc id="d">Three study directions: test boundaries, investigate signals and evaluate AI behavior. Subtle animated accents.</desc><style>.a{animation:pulse 8s ease-in-out infinite}.b{animation-delay:2.6s}.c{animation-delay:5.2s}@keyframes pulse{0%,60%,100%{opacity:.3}25%{opacity:1}}@media(prefers-reduced-motion:reduce){.a{animation:none}}</style><rect width="1000" height="160" rx="14" fill="#080f1d"/><g font-family="monospace"><g fill="#102039" stroke="#253d58"><rect x="18" y="18" width="310" height="124" rx="10"/><rect x="345" y="18" width="310" height="124" rx="10"/><rect x="672" y="18" width="310" height="124" rx="10"/></g><g font-size="19"><text x="38" y="57" fill="#fda4af">01 / OFFENSIVE</text><text x="365" y="57" fill="#7dd3fc">02 / DEFENSIVE</text><text x="692" y="57" fill="#c4b5fd">03 / AI SECURITY</text></g><g font-size="14" fill="#b8cce2"><text x="38" y="87">Test trust boundaries</text><text x="365" y="87">Investigate signals</text><text x="692" y="87">Evaluate model behavior</text></g><path class="a" d="M38 116H308" stroke="#fb7185" stroke-width="3"/><path class="a b" d="M365 116H635" stroke="#38bdf8" stroke-width="3"/><path class="a c" d="M692 116H962" stroke="#a78bfa" stroke-width="3"/></g></svg>