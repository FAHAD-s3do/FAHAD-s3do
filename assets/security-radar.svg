<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc">
<title id="title">Security focus areas</title>
<desc id="desc">An animated radar beside four areas of focus: offensive security, defensive security, AI security, and cloud and DevSecOps. This is a conceptual visual, not live monitoring data.</desc>
<style>
.scan{transform-origin:140px 125px;animation:sweep 10s linear infinite}
.pulse{animation:pulse 3s ease-in-out infinite}
.p2{animation-delay:.75s}.p3{animation-delay:1.5s}.p4{animation-delay:2.25s}
@keyframes sweep{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.scan,.pulse{animation:none}}
</style>
<rect x="1" y="1" width="998" height="248" rx="16" fill="#080f1d" stroke="#223a56" stroke-width="2"/>
<g fill="none" stroke="#254766">
<circle cx="140" cy="125" r="91"/><circle cx="140" cy="125" r="61"/><circle cx="140" cy="125" r="31"/>
<path d="M49 125H231M140 34V216"/>
</g>
<g class="scan"><path d="M140 125L140 34A91 91 0 0 1 204 60Z" fill="#38bdf8" opacity=".14"/><path d="M140 125V34" stroke="#38bdf8" stroke-width="2"/></g>
<circle class="pulse" cx="105" cy="82" r="5" fill="#fb7185"/>
<circle class="pulse p2" cx="184" cy="143" r="5" fill="#38bdf8"/>
<circle class="pulse p3" cx="123" cy="167" r="5" fill="#c084fc"/>
<circle class="pulse p4" cx="165" cy="97" r="5" fill="#4ade80"/>
<g font-family="Arial,sans-serif">
<text x="285" y="52" fill="#7dd3fc" font-size="13" letter-spacing="3">SECURITY FOCUS</text>
<text x="285" y="81" fill="#e2edff" font-size="24" font-weight="bold">Explore. Detect. Improve.</text>
<rect x="285" y="101" width="305" height="49" rx="10" fill="#211422" stroke="#743044"/>
<text x="305" y="132" fill="#fda4af" font-size="17" font-weight="bold">Offensive security</text>
<rect x="605" y="101" width="345" height="49" rx="10" fill="#101f36" stroke="#28547c"/>
<text x="625" y="132" fill="#7dd3fc" font-size="17" font-weight="bold">Defensive security</text>
<rect x="285" y="162" width="305" height="49" rx="10" fill="#201633" stroke="#62408b"/>
<text x="305" y="193" fill="#d8b4fe" font-size="17" font-weight="bold">AI security</text>
<rect x="605" y="162" width="345" height="49" rx="10" fill="#10241f" stroke="#28634c"/>
<text x="625" y="193" fill="#86efac" font-size="17" font-weight="bold">Cloud &amp; DevSecOps</text>
<text x="285" y="233" fill="#7895b7" font-size="13">Areas of practice and study · conceptual visual, not live telemetry</text>
</g>
</svg>
